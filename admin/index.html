<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Winco 홈페이지 관리</title><link rel="icon" href="/assets/images/logo/favicon.svg"><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head><body><div id="app"><p class="loading">Winco 홈페이지 관리 화면을 불러오고 있습니다…</p></div><div id="message" role="status" aria-live="polite"></div><dialog id="publish-dialog" aria-label="홈페이지 게시"><div class="dialog-bar"><strong>홈페이지 게시</strong><button data-action="cancel-publish">닫기</button></div><div style="padding:24px"><p>저장한 내용을 공개 홈페이지에 게시합니다. 숨김 페이지는 공개되지 않습니다.</p><div class="actions" style="margin-top:24px"><button data-action="cancel-publish">취소</button><button class="primary" data-action="confirm-publish">게시 시작</button></div></div></dialog><dialog id="preview-dialog" aria-label="게시 전 미리보기"><div class="dialog-bar"><strong>게시 전 미리보기 · 문의 전송 비활성화</strong><label class="preview-select">페이지<select id="preview-page"></select></label><button data-action="preview-mobile">휴대폰</button><button data-action="preview-desktop">PC</button><button data-action="close-preview">닫기</button></div><iframe title="홈페이지 미리보기" sandbox="allow-scripts"></iframe></dialog><dialog id="media-dialog" aria-label="사진 선택"><div class="dialog-bar"><strong>사진 선택</strong><label class="upload-button">사진 업로드<input id="upload-file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><button data-action="close-media">닫기</button></div><p>새 사진은 초안에 저장되며, 게시한 페이지에 사용한 사진만 공개됩니다.</p><label>사진 이름 검색<input id="media-search" type="search" placeholder="파일 이름으로 찾기"></label><p id="upload-progress" role="status"></p><p id="media-count" role="status"></p><div id="media-grid"></div></dialog><datalist id="page-addresses"></datalist>
<dialog id="decision-dialog" aria-labelledby="decision-title"><h2 id="decision-title">변경 확인</h2><p></p><form method="dialog" class="actions"><button value="cancel" autofocus>취소</button><button class="primary" value="confirm">확인</button></form></dialog>
<dialog id="page-dialog" aria-labelledby="page-title"><div class="dialog-bar"><h2 id="page-title">새 페이지 · 글</h2><button data-action="close-page">닫기</button></div><form id="page-form"><input type="hidden" name="kind"><label>페이지 제목<input name="title" required maxlength="120" placeholder="예: Summer collection"></label><label>페이지 주소<input name="slug" required maxlength="64" pattern="[a-z][a-z0-9-]{0,63}" placeholder="예: summer-collection" autocapitalize="none" spellcheck="false"></label><p class="muted">영문 소문자·숫자·하이픈을 사용하세요. 숨김 초안으로 만들어지며, 저장만으로 공개되지 않습니다.</p><p id="page-error" class="form-error" role="alert"></p><div class="actions"><button type="button" data-action="close-page">취소</button><button type="submit" class="primary">초안 만들기</button></div></form></dialog></body></html>
