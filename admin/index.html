<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Winco 홈페이지 관리</title><link rel="icon" href="/assets/images/logo/favicon.svg"><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head><body><div id="app"><p class="loading">Winco 홈페이지 관리 화면을 불러오고 있습니다…</p></div><div id="message" role="status" aria-live="polite"></div><dialog id="publish-dialog"><div class="dialog-bar"><strong>홈페이지 게시</strong><button data-action="cancel-publish">닫기</button></div><div style="padding:24px"><p>저장한 내용을 공개 홈페이지에 게시합니다. 숨김 페이지는 공개되지 않습니다.</p><div class="actions" style="margin-top:24px"><button data-action="cancel-publish">취소</button><button class="primary" data-action="confirm-publish">게시 시작</button></div></div></dialog><dialog id="preview-dialog"><div class="dialog-bar"><strong>게시 전 미리보기 · 문의 전송 비활성화</strong><button data-action="preview-mobile">휴대폰</button><button data-action="preview-desktop">PC</button><button data-action="close-preview">닫기</button></div><iframe title="홈페이지 미리보기" sandbox="allow-scripts"></iframe></dialog><dialog id="media-dialog"><div class="dialog-bar"><strong>사진 선택</strong><label class="upload-button">사진 업로드<input id="upload-file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><button data-action="close-media">닫기</button></div><p>새 사진은 초안에 저장되며, 게시한 페이지에 사용한 사진만 공개됩니다.</p><div id="media-grid"></div></dialog></body></html>
