[build]
  command = "npm run build && npm run check"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Recheck the staff-app entry point on every navigation, including iPad web apps.
# Hashed assets keep their normal caching; open forms update only on request.
[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "script-src-elem 'unsafe-inline' https://wincoblinds.ca/app/assets/ https://www.wincoblinds.ca/app/assets/ https://*.netlify.app/app/assets/"
[[headers]]
  for = "/app/"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "script-src-elem 'unsafe-inline' https://wincoblinds.ca/app/assets/ https://www.wincoblinds.ca/app/assets/ https://*.netlify.app/app/assets/"
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "script-src-elem 'unsafe-inline' https://wincoblinds.ca/app/assets/ https://www.wincoblinds.ca/app/assets/ https://*.netlify.app/app/assets/"
[[headers]]
  for = "/app/version.json"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "script-src-elem 'unsafe-inline' https://wincoblinds.ca/app/assets/ https://www.wincoblinds.ca/app/assets/ https://*.netlify.app/app/assets/"

# Preserve legacy Measure inline behavior while allowing only the app's script assets.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "script-src-elem 'unsafe-inline' https://wincoblinds.ca/app/assets/ https://www.wincoblinds.ca/app/assets/ https://*.netlify.app/app/assets/"
