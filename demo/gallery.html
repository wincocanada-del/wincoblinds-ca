<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/demo/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery | Winco Blinds</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="site.js?v=2" defer></script>
</head>
<body>
  <a class="skip-link" href="gallery.html#main">Skip to content</a>
  <header class="site-header">
    <div class="page-width header-inner">
      <a class="brand" href="index.html" aria-label="Winco Blinds home">
        <img src="assets/winco-logo.png" alt="Winco Blinds" width="288" height="61">
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu <span class="menu-icon" aria-hidden="true"></span></button>
      <nav class="site-nav" id="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="guides.html">Guides</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <button type="button" class="search-opener" aria-label="Search the site"><span class="search-mark" aria-hidden="true"></span></button>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="page-heading">
      <div class="page-width">
        <h1>Gallery</h1>
      </div>
    </div>
    <div class="page-width gallery-grid">
      <a class="gallery-photo" href="assets/bedroom.webp" aria-label="Enlarge: Dual shades in a bedroom">
        <img src="assets/bedroom.webp" alt="Dual shades in a bedroom" width="1443" height="688">
        <span aria-hidden="true">+</span>
      </a>
      <a class="gallery-photo" href="assets/living-room.webp" aria-label="Enlarge: Dual shades on corner living-room windows">
        <img src="assets/living-room.webp" alt="Dual shades on corner living-room windows" width="1060" height="1060">
        <span aria-hidden="true">+</span>
      </a>
      <a class="gallery-photo" href="assets/gathering-space.webp" aria-label="Enlarge: Cream dual shades around a seating area">
        <img src="assets/gathering-space.webp" alt="Cream dual shades around a seating area" width="1003" height="997">
        <span aria-hidden="true">+</span>
      </a>
      <a class="gallery-photo" href="assets/roller-shades.webp" aria-label="Enlarge: Roller shades beside an office entrance">
        <img src="assets/roller-shades.webp" alt="Roller shades beside an office entrance" width="1060" height="1055" loading="lazy">
        <span aria-hidden="true">+</span>
      </a>
      <a class="gallery-photo" href="assets/dining-room.webp" aria-label="Enlarge: Dual shades beside a dining room">
        <img src="assets/dining-room.webp" alt="Dual shades beside a dining room" width="1060" height="1060" loading="lazy">
        <span aria-hidden="true">+</span>
      </a>
      <a class="gallery-photo" href="assets/lounge.webp" aria-label="Enlarge: Dark dual shades behind a lounge seating area">
        <img src="assets/lounge.webp" alt="Dark dual shades behind a lounge seating area" width="1414" height="675" loading="lazy">
        <span aria-hidden="true">+</span>
      </a>
    </div>
  </main>
  <dialog class="photo-dialog" id="photo-dialog" aria-labelledby="photo-caption">
    <form method="dialog" class="dialog-toolbar">
      <button class="close-button" aria-label="Close photo">Close <span aria-hidden="true">×</span></button>
    </form>
    <figure>
      <img alt="">
      <figcaption id="photo-caption"></figcaption>
    </figure>
    <div class="photo-controls">
      <button type="button" data-photo-step="-1" aria-label="Previous photo">←</button>
      <span role="status" id="photo-count"></span>
      <button type="button" data-photo-step="1" aria-label="Next photo">→</button>
    </div>
  </dialog>
  <footer class="site-footer">
    <div class="page-width footer-inner">
      <span>Winco Blinds &amp; Window Fashion</span>
      <a href="contact.html#showroom">9790 51 Ave NW, Edmonton</a>
      <a href="tel:+17808092292">(780) 809-2292</a>
    </div>
  </footer>
</body>
</html>
